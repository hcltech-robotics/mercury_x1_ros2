
# R818
# audiocodec
# ac107
#
# Mercury X1 (mercury_x1_voice_board/board/asound.conf). Changed from the stock file:
# the USB gadget (UAC1, p_chmask 0x3f) carries 6 channels at 16 kHz to the Orin:
#   0-3  the four mics (AC107 channels 0-3, raw)
#   4    speaker echo reference (AC107 channel 6)
#   5    the demo's processed beam (what used to be the mono stream)
# The AC107 capture is shared through dsnoop (demo + rawmic.sh), the gadget through one 6-channel dmix.

ctl.!default {
    type hw
    card audiocodec
}

pcm.!default {
    type asym
    playback.pcm "Playback"
    capture.pcm "CaptureAc107"
}

pcm.Playback {
    type plug
    slave.pcm {
        type softvol
        slave.pcm PlaybackDmix
        control {
            name "Soft Volume Master"
            card UAC1Gadget
        }
        min_dB -51.0
        max_dB 0.0
        resolution 256
    }
}

pcm.UsbDmix {
    type dmix
    ipc_key 1111
    ipc_perm 0666
    slave {
        pcm "hw:UAC1Gadget"
        format S16_LE
        rate 16000
        channels 6
        period_size 320
        periods 6
    }
}

# Mono beam from the demo -> USB channel 5.
pcm.PlaybackDmix {
    type plug
    slave.pcm {
        type route
        slave.pcm "UsbDmix"
        slave.channels 6
        ttable.0.5 1
    }
}

# Raw AC107 8 ch -> USB channels 0-4 (mics 0-3, reference 6). Used by rawmic.sh.
pcm.RawToUsb {
    type route
    slave.pcm "UsbDmix"
    slave.channels 6
    ttable.0.0 1
    ttable.1.1 1
    ttable.2.2 1
    ttable.3.3 1
    ttable.6.4 1
}

pcm.Capture {
    type hw
    card audiocodec
}

pcm.Ac107Snoop {
    type dsnoop
    ipc_key 2222
    ipc_perm 0666
    slave {
        pcm "hw:sndac10710036"
        format S16_LE
        rate 16000
        channels 8
        period_size 512
        periods 4
    }
}

pcm.CaptureAc107 {
    type plug
    slave.pcm "Ac107Snoop"
}

pcm.CaptureDsnoop {
    type plug
    slave.pcm "Ac107Snoop"
}

pcm.PlaybackHpoutSpeaker {
    type hooks
    slave.pcm "PlaybackDmix"
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "HpSpeaker Switch"
                optional true
                value 1
            }
        ]
    }
}

pcm.PlaybackLineoutSpeaker {
    type hooks
    slave.pcm "PlaybackDmix"
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "LINEOUT Output Select"
                optional true
                value 1
            }
            {
                name "LINEOUT Switch"
                optional true
                value 1
            }
            {
                name "LINEOUT volume"
                optional true
                value 20
            }
        ]
    }
}

pcm.CaptureMic {
    type hooks
    slave.pcm "CaptureAc107"
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "Channel 1 PGA Gain"
                optional true
                value 20
            }
            {
                name "Channel 2 PGA Gain"
                optional true
                value 20
            }
        ]
    }
}

pcm.CaptureReference {
    type hooks
    slave.pcm "Capture"
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "ADCL Input MIC1 Boost Switch"
                optional true
                value 1
            }
            {
                name "ADCR Input MIC2 Boost Switch"
                optional true
                value 1
            }
            {
                name "MIC1 gain volume"
                optional true
                value 0
            }
            {
                name "MIC2 gain volume"
                optional true
                value 0
            }
        ]
    }
}

pcm.CaptureAec {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { pcm "CaptureMic" channels 2 }
            b { pcm "CaptureReference" channels 2 }
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.2.2 1
    ttable.3.3 1
}
