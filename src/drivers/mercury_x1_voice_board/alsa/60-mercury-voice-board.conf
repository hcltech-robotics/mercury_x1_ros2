# Mercury X1 head voice board (USB "XFM-DP-V0.0.18", UAC1, 6 ch, 16 kHz, S16). Installed to /etc/alsa/conf.d/
# by scripts/install_voice_board_audio.sh. Channels (set up by the board's asound.conf, see ../board/):
#   0-3  the four mics, raw (linear array, 35 mm pitch)
#   4    speaker echo reference (analog loopback into the board)
#   5    the board's processed beam (its own AEC + beamforming, what used to be the mono stream)
# The card is shared through dsnoop, so several programs can capture at once.

pcm.mx1_array {
    type dsnoop
    ipc_key 7176
    ipc_perm 0666
    slave {
        pcm "hw:CARD=XFMDPV0018,DEV=0"
        format S16_LE
        rate 16000
        channels 6
        period_size 320
        periods 4
    }
    hint.description "Mercury X1 voice board, 6 ch: mics 0-3, echo reference, board beam"
}

# Board-processed beam, mono (any rate/format through plug).
pcm.mx1_beam {
    type plug
    slave.pcm {
        type route
        slave.pcm "mx1_array"
        slave.channels 6
        ttable.0.5 1
    }
    hint.description "Mercury X1 voice board, processed beam (mono)"
}

# The four raw mics plus the echo reference, 5 ch.
pcm.mx1_mics {
    type plug
    slave.pcm {
        type route
        slave.pcm "mx1_array"
        slave.channels 6
        ttable.0.0 1
        ttable.1.1 1
        ttable.2.2 1
        ttable.3.3 1
        ttable.4.4 1
    }
    hint.description "Mercury X1 voice board, raw mics 0-3 + echo reference"
}

# Clean speech from the Orin-side front end (mercury-voicefront.service: voicefront on mx1_mics with echo
# cancellation, beamforming, GTCRN neural noise suppression and AGC; see board/orin_voicefront.sh). It plays
# into an ALSA loopback card (snd-aloop, /etc/modules-load.d/mercury-aloop.conf); any program captures it from
# the other side. The voice chat uses it (VOICE_MIC=mx1_clean in ~/.config/mercury_x1/voice.env).
pcm.mx1_clean_out {
    type plug
    slave.pcm "hw:Loopback,0,0"
    hint.description "Mercury X1 clean speech, written by mercury-voicefront (do not use directly)"
}
pcm.mx1_clean {
    type plug
    slave.pcm "hw:Loopback,1,0"
    hint.description "Mercury X1 clean speech (echo cancelled, beamformed, denoised), 16 kHz mono"
}
