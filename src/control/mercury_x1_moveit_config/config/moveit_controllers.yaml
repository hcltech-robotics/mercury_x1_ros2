# Trajectories go to FollowJointTrajectory action servers in the upper-body driver (mercury_upper_body),
# which turns them into firmware moves; scripts/mock_arm_driver.py serves the same actions off-robot.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - waist_controller
  left_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint1_L, joint2_L, joint3_L, joint4_L, joint5_L, joint6_L, joint7_L]
  right_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint1_R, joint2_R, joint3_R, joint4_R, joint5_R, joint6_R, joint7_R]
  waist_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [body]

trajectory_execution:
  allowed_execution_duration_scaling: 2.0     # the firmware interpolates on its own: allow slack
  allowed_goal_duration_margin: 2.0
  allowed_start_tolerance: 0.05               # rad; joint_states arrive at ~15 Hz per arm
